name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend
        working-directory: backend
        run: npm ci && npm run build && npm test
      - name: Worker
        working-directory: worker
        run: npm ci && npm run typecheck && npm test
      - name: App
        working-directory: app
        run: npm ci && npm run lint && npm run build && npx vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd backend && npm ci)
          (cd worker && npm ci)
          (cd app && npm ci)
      - name: Deploy Worker
        id: worker
        working-directory: worker
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Build app
        working-directory: app
        env:
          VITE_BACKEND_HTTP: ${{ steps.worker.outputs.url }}
          VITE_PUBLIC_URL: https://clarion-craiova.pages.dev
        run: |
          host="${VITE_BACKEND_HTTP#https://}"
          export VITE_BACKEND_URL="wss://${host}/ws?client=console"
          npm run build
      - name: Deploy Pages
        working-directory: app
        run: npx wrangler pages deploy dist --project-name clarion-craiova --branch main --commit-dirty=true
      - name: Smoke
        run: |
          curl -fsS "${{ steps.worker.outputs.url }}/health"
          curl -fsS -o /dev/null https://clarion-craiova.pages.dev/join
